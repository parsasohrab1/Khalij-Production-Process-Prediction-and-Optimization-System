apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerting
  namespace: khalij-pos
  labels:
    app: alerting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alerting
  template:
    metadata:
      labels:
        app: alerting
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8004"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: khalij-pos
      containers:
        - name: alerting
          image: khalij/alerting:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
              name: http
          envFrom:
            - configMapRef:
                name: khalij-pos-config
            - secretRef:
                name: khalij-pos-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: alerting
  namespace: khalij-pos
spec:
  selector:
    app: alerting
  ports:
    - port: 8004
      targetPort: 8004
      name: http
