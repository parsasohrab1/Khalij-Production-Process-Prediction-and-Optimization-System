apiVersion: apps/v1
kind: Deployment
metadata:
  name: preprocessing
  namespace: khalij-pos
  labels:
    app: preprocessing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: preprocessing
  template:
    metadata:
      labels:
        app: preprocessing
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: khalij-pos
      containers:
        - name: preprocessing
          image: khalij/preprocessing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          envFrom:
            - configMapRef:
                name: khalij-pos-config
            - secretRef:
                name: khalij-pos-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: preprocessing
  namespace: khalij-pos
spec:
  selector:
    app: preprocessing
  ports:
    - port: 8002
      targetPort: 8002
      name: http
