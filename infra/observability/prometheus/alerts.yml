groups:
  - name: khalij-pos-availability
    rules:
      - alert: ServiceDown
        expr: up{job=~"khalij-.*"} == 0
        for: 1m
        labels:
          severity: critical
          nfr: NFR-PER-02
        annotations:
          summary: "Service {{ $labels.job }} is unavailable"
          description: "Uptime target 99.99% — the service has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(khalij_http_requests_total{status=~"5.."}[5m]))
            /
          clamp_min(sum by (service) (rate(khalij_http_requests_total[5m])), 0.001)
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Error rate above 5% in {{ $labels.service }}"

      - alert: HighPredictionLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(khalij_http_request_duration_seconds_bucket{service="prediction"}[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
          nfr: NFR-PER-01
        annotations:
          summary: "Prediction P95 latency above 2 seconds (NFR-PER-01)"

      - alert: ErrorBudgetBurn
        expr: |
          (1 - avg_over_time(up{job=~"khalij-api-gateway|khalij-prediction|khalij-data-ingestion"}[1h]))
            > (1 - 0.9999) * 14
        for: 10m
        labels:
          severity: critical
          nfr: NFR-PER-02
        annotations:
          summary: "Fast burn of the 99.99% SLO error budget in the last 1 hour"
