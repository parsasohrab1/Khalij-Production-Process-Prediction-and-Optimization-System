apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
replicas:
  - name: api-gateway
    count: 1
  - name: data-ingestion
    count: 1
  - name: preprocessing
    count: 1
  - name: prediction
    count: 1
  - name: alerting
    count: 1
patches:
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
