server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: khalij-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(khalij-.*|.*api-gateway.*|.*data-ingestion.*|.*preprocessing.*|.*prediction.*|.*alerting.*)'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: logstream
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            service: service
            message: message
            ts: ts
          source: output
      - labels:
          level:
          service:
