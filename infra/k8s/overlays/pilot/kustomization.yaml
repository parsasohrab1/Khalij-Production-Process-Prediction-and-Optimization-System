apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: khalij-pos
resources:
  - ../../base
replicas:
  - name: api-gateway
    count: 2
  - name: data-ingestion
    count: 1
  - name: preprocessing
    count: 1
  - name: prediction
    count: 2
  - name: alerting
    count: 1
patches:
  - path: config-patch.yaml
  - target:
      kind: Ingress
      name: khalij-pos
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: pilot.pos.khalij.local
      - op: replace
        path: /spec/tls/0/hosts/0
        value: pilot.pos.khalij.local
  - target:
      kind: HorizontalPodAutoscaler
      name: data-ingestion
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: Deployment
      name: data-ingestion
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: INGESTION_SHARD_COUNT
            value: "1"
          - name: HOSTNAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
