global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: khalij-api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8000"]
        labels:
          service: api-gateway

  - job_name: khalij-data-ingestion
    metrics_path: /metrics
    static_configs:
      - targets: ["data-ingestion:8001"]
        labels:
          service: data-ingestion

  - job_name: khalij-preprocessing
    metrics_path: /metrics
    static_configs:
      - targets: ["preprocessing:8002"]
        labels:
          service: preprocessing

  - job_name: khalij-prediction
    metrics_path: /metrics
    static_configs:
      - targets: ["prediction:8003"]
        labels:
          service: prediction

  - job_name: khalij-alerting
    metrics_path: /metrics
    static_configs:
      - targets: ["alerting:8004"]
        labels:
          service: alerting
