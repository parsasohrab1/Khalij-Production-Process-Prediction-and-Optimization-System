# ==========================================================================
# Phase 10 — Olefin Unit 1 pilot configuration
# ==========================================================================
pilot:
  name: "khalij-pos-olefin-pilot"
  version: "1.0.0"
  site: "Persian Gulf Holding — Olefin Unit 1"
  unit_id: 1
  unit_name: "Olefin Unit 1"
  duration_days: 14
  mode: "shadow"   # shadow = recommendation without automatic application | assisted = operator applies
  data_source_mode: "simulator"  # on site: opcua | modbus
  owner: "control-room-supervisor"
  rollback_max_minutes: 30

scope:
  sensors:
    - reactor_temp_c
    - reactor_pressure_bar
    - feed_flow_m3h
    - tank_level_percent
    - ethylene_conc_percent
    - compressor_rpm
  features_enabled:
    - ingestion
    - preprocessing
    - prediction
    - alerts
    - optimization_recommend
    - whatif
    - shift_reports
    - dashboard
    - audit
  features_disabled_until_signoff:
    - auto_apply_setpoints   # automatic application to the DCS is forbidden until safety approval

acceptance_criteria:
  - id: AC-01
    srs: R-GEN-01
    description: "At least 1 sensor record per second for the pilot unit"
    metric: "ingestion_rate_hz >= 1"
  - id: AC-02
    srs: FR-ML-01
    description: "Temperature prediction with a 60-second horizon and P95 latency < 2 seconds"
    metric: "prediction_p95_ms <= 2000"
  - id: AC-03
    srs: FR-ML-02
    description: "Critical alert at >5% deviation is recorded and reaches the control room"
    metric: "critical_alert_delivered == true"
  - id: AC-04
    srs: FR-ML-03
    description: "Optimization recommendation is produced with safety constraints"
    metric: "optimize_constraints_satisfied == true"
  - id: AC-05
    srs: NFR-SEC-01
    description: "Operator login only with 2FA"
    metric: "login_requires_otp == true"
  - id: AC-06
    srs: NFR-PER-02
    description: "Cumulative downtime during the pilot period is below the weekly SLO budget"
    metric: "weekly_downtime_s <= 60.5"
  - id: AC-07
    srs: R-GEN-03
    description: "Live sensor/prediction/alert dashboard is observable"
    metric: "dashboard_snapshot_ok == true"
  - id: AC-08
    srs: R-GEN-04
    description: "Shift report can be generated and exported to PDF/Excel"
    metric: "shift_report_export_ok == true"

gates:
  go_live:
    - pilot_readiness_script_pass
    - secrets_rotated_from_defaults
    - network_firewall_reviewed
    - operator_training_completed
    - safety_signoff_supervisor
  exit_pilot:
    - all_ac_passed_or_waived
    - post_mortem_filed
    - production_runbook_updated
