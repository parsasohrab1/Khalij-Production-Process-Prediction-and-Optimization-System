apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: khalij-pos
  namespace: khalij-pos
  labels:
    app.kubernetes.io/part-of: khalij-pos
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "api-gateway"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pos.khalij.local
      secretName: khalij-pos-tls
  rules:
    - host: pos.khalij.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-external-to-data-plane
  namespace: khalij-pos
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [postgres, redis, kafka, influxdb, prediction, preprocessing, data-ingestion, alerting]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-gateway
  namespace: khalij-pos
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
