apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction
  namespace: khalij-pos
  labels:
    app: prediction
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prediction
  template:
    metadata:
      labels:
        app: prediction
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: khalij-pos
      containers:
        - name: prediction
          image: khalij/prediction:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
              name: http
          envFrom:
            - configMapRef:
                name: khalij-pos-config
            - secretRef:
                name: khalij-pos-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prediction
  namespace: khalij-pos
spec:
  selector:
    app: prediction
  ports:
    - port: 8003
      targetPort: 8003
      name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: prediction-pdb
  namespace: khalij-pos
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: prediction
