apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-ingestion
  namespace: khalij-pos
  labels:
    app: data-ingestion
    app.kubernetes.io/part-of: khalij-pos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-ingestion
  template:
    metadata:
      labels:
        app: data-ingestion
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: khalij-pos
      containers:
        - name: data-ingestion
          image: khalij/data-ingestion:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: khalij-pos-config
            - secretRef:
                name: khalij-pos-secrets
          env:
            - name: INGESTION_SHARD_COUNT
              value: "2"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: data-ingestion
  namespace: khalij-pos
spec:
  selector:
    app: data-ingestion
  ports:
    - port: 8001
      targetPort: 8001
      name: http
