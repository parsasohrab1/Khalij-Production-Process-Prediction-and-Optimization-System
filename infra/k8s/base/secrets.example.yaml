# ⚠️ For development/demo only. In production replace with External Secrets / Sealed Secrets.
# Copy to secrets.yaml and change the values (secrets.yaml is suggested for .gitignore).
apiVersion: v1
kind: Secret
metadata:
  name: khalij-pos-secrets
  namespace: khalij-pos
  labels:
    app.kubernetes.io/part-of: khalij-pos
type: Opaque
stringData:
  POSTGRES_USER: khalij_admin
  POSTGRES_PASSWORD: change_me_k8s
  POSTGRES_DB: khalij_pos
  POSTGRES_DSN: postgresql+psycopg2://khalij_admin:change_me_k8s@postgres:5432/khalij_pos
  REDIS_PASSWORD: change_me_redis
  REDIS_URL: redis://:change_me_redis@redis:6379/0
  INFLUXDB_TOKEN: change_me_influx_token_please_replace
  INFLUXDB_ADMIN_USER: admin
  INFLUXDB_ADMIN_PASSWORD: change_me_influx
  JWT_SECRET_KEY: replace-with-long-random-jwt-secret-key-32chars
  # 32-byte key base64 — generate: python -c "from shared.crypto import generate_key_b64; print(generate_key_b64())"
  DATA_ENCRYPTION_KEY: ""
  INTERNAL_API_KEY: replace-internal-api-key
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHAT_ID: ""
  SMTP_HOST: ""
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_FROM_ADDRESS: ""
  SMTP_TO_ADDRESSES: ""
