# ==========================================================================
# Khalij POS - main infrastructure (Data Lake, Cache, Message Bus, MLOps, Services)
# Per section 5 of the SRS document: PostgreSQL + InfluxDB + Redis + Kafka + MLflow
# ==========================================================================

networks:
  khalij-net:
    driver: bridge

volumes:
  postgres-data:
  influxdb-data:
  redis-data:
  kafka-data:
  mlflow-artifacts:

services:
  # -------------------------------------------------------------------
  # Transactional database: users, operators, alerts, shift reports
  # -------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: khalij-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [khalij-net]

  # -------------------------------------------------------------------
  # Time-series database: temperature, pressure, flow, level, gas composition, RPM
  # -------------------------------------------------------------------
  influxdb:
    image: influxdb:2.7-alpine
    container_name: khalij-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_HOT_RETENTION:-30d}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [khalij-net]

  # -------------------------------------------------------------------
  # Phase 2: build the cold bucket (5-year) + downsampling Task every 1 minute
  # -------------------------------------------------------------------
  influxdb-init:
    build:
      context: .
      dockerfile: infra/influxdb/Dockerfile
    container_name: khalij-influxdb-init
    restart: "no"
    env_file: .env
    environment:
      INFLUXDB_URL: ${INFLUXDB_URL}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_BUCKET_DOWNSAMPLED: ${INFLUXDB_BUCKET_DOWNSAMPLED:-process_sensors_1m}
      INFLUXDB_HOT_RETENTION: ${INFLUXDB_HOT_RETENTION:-30d}
      INFLUXDB_RETENTION: ${INFLUXDB_RETENTION:-1825d}
    depends_on:
      influxdb:
        condition: service_healthy
    networks: [khalij-net]

  # -------------------------------------------------------------------
  # Phase 2: create the main topics + Dead Letter Queue
  # -------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: khalij-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_started
    environment:
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-12}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Kafka...";
        sleep 8;
        PARTS=${KAFKA_PARTITIONS:-12};
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic raw-sensor-data --partitions $$PARTS --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic processed-sensor-data --partitions $$PARTS --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic process-predictions --partitions $$PARTS --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic process-alerts --partitions 6 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic raw-sensor-data-dlq --partitions 1 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic processed-sensor-data-dlq --partitions 1 --replication-factor 1;
        echo "Kafka topics ready (partitions=$$PARTS).";
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list;
    networks: [khalij-net]

  # -------------------------------------------------------------------
  # Cache for fast serving of the latest sensor values and prediction results
  # -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: khalij-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [khalij-net]

  # -------------------------------------------------------------------
  # Sensor data streaming (KRaft mode - no Zookeeper needed)
  # -------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: khalij-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [khalij-net]

  # -------------------------------------------------------------------
  # MLOps: registry, versioning and serving of LSTM/XGBoost models
  # -------------------------------------------------------------------
  mlflow:
    build:
      context: ./infra/mlflow
    container_name: khalij-mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI}
      MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT}
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts
    networks: [khalij-net]

  # -------------------------------------------------------------------
  # Application microservices (FastAPI)
  # -------------------------------------------------------------------
  data-ingestion:
    build:
      context: .
      dockerfile: services/data-ingestion/Dockerfile
    # Without a fixed container_name so docker compose scale is possible (phase 7)
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_SOURCE_MODE: ${DATA_SOURCE_MODE:-simulator}
      DATA_UNIT_ID: ${DATA_UNIT_ID:-1}
      DATA_UNIT_IDS: ${DATA_UNIT_IDS:-1}
      INGESTION_SHARD_COUNT: ${INGESTION_SHARD_COUNT:-1}
      INGESTION_SHARD_ID: ${INGESTION_SHARD_ID:-0}
      INGESTION_INTERVAL_S: ${INGESTION_INTERVAL_S:-1.0}
      INFLUX_BATCH_SIZE: ${INFLUX_BATCH_SIZE:-50}
      OPCUA_ENDPOINT_URL: ${OPCUA_ENDPOINT_URL:-opc.tcp://opcua-test-server:4840/khalij/olefin1/}
      MODBUS_HOST: ${MODBUS_HOST:-modbus-test-server}
      MODBUS_PORT: ${MODBUS_PORT:-5020}
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-3}
      CIRCUIT_BREAKER_RECOVERY_TIMEOUT_S: ${CIRCUIT_BREAKER_RECOVERY_TIMEOUT_S:-30}
      HARDWARE_READ_TIMEOUT_S: ${HARDWARE_READ_TIMEOUT_S:-3}
    depends_on:
      kafka:
        condition: service_started
      influxdb:
        condition: service_healthy
    ports:
      - "${DATA_INGESTION_PORT:-8001}:8001"
    networks: [khalij-net]

  # -------------------------------------------------------------------
  # Phase 1 hardware simulators (only with profile=hardware-sim)
  # docker compose --profile hardware-sim up -d
  # -------------------------------------------------------------------
  opcua-test-server:
    build:
      context: .
      dockerfile: services/data-ingestion/hardware_sim/Dockerfile.opcua
    container_name: khalij-opcua-test
    restart: unless-stopped
    profiles: ["hardware-sim"]
    ports:
      - "4840:4840"
    networks: [khalij-net]

  modbus-test-server:
    build:
      context: .
      dockerfile: services/data-ingestion/hardware_sim/Dockerfile.modbus
    container_name: khalij-modbus-test
    restart: unless-stopped
    profiles: ["hardware-sim"]
    ports:
      - "5020:5020"
    networks: [khalij-net]

  preprocessing:
    build:
      context: .
      dockerfile: services/preprocessing/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      kafka:
        condition: service_started
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PREPROCESSING_PORT:-8002}:8002"
    networks: [khalij-net]

  prediction:
    build:
      context: .
      dockerfile: services/prediction/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PREDICTION_LATENCY_BUDGET_MS: ${PREDICTION_LATENCY_BUDGET_MS:-2000}
    depends_on:
      kafka:
        condition: service_started
      mlflow:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "${PREDICTION_PORT:-8003}:8003"
    networks: [khalij-net]

  alerting:
    build:
      context: .
      dockerfile: services/alerting/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "${ALERTING_PORT:-8004}:8004"
    networks: [khalij-net]

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: khalij-api-gateway
    restart: unless-stopped
    env_file: .env
    depends_on:
      - data-ingestion
      - preprocessing
      - prediction
      - alerting
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    networks: [khalij-net]

  # -------------------------------------------------------------------
  # Reverse Proxy with TLS 1.3 (NFR-SEC-02)
  # Secure access: https://localhost
  # -------------------------------------------------------------------
  tls-gateway:
    image: nginx:1.27-alpine
    container_name: khalij-tls-gateway
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs
      - ./infra/nginx/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks: [khalij-net]
