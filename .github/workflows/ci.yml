name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lint tools
        run: pip install ruff==0.5.0

      - name: Ruff lint (shared + services)
        run: ruff check shared services data

      - name: Byte-compile syntax check
        run: |
          python -m py_compile $(git ls-files '*.py')

  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy .env for validation
        run: cp .env.example .env

      - name: Validate docker-compose config
        run: docker compose config -q

  validate-k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate K8s manifests (phase 9)
        run: |
          pip install PyYAML==6.0.2
          python scripts/test_phase9.py
          python scripts/test_phase10.py
          python scripts/pilot_readiness.py
          python scripts/pilot_smoke.py --offline

      - name: Kustomize build
        run: |
          kubectl kustomize infra/k8s/base > /tmp/khalij-k8s.yaml
          kubectl kustomize infra/k8s/overlays/dev > /tmp/khalij-k8s-dev.yaml
          kubectl kustomize infra/k8s/overlays/pilot > /tmp/khalij-k8s-pilot.yaml
          test -s /tmp/khalij-k8s.yaml
          grep -q "kind: Deployment" /tmp/khalij-k8s.yaml
          grep -q "api-gateway" /tmp/khalij-k8s.yaml
          grep -q "pilot.pos.khalij.local" /tmp/khalij-k8s-pilot.yaml

  build-images:
    runs-on: ubuntu-latest
    needs: [lint-and-syntax, validate-compose, validate-k8s]
    strategy:
      matrix:
        service: [api-gateway, data-ingestion, preprocessing, prediction, alerting]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t khalij-${{ matrix.service }}:ci .
