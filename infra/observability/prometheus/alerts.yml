groups:
  - name: khalij-pos-availability
    rules:
      - alert: ServiceDown
        expr: up{job=~"khalij-.*"} == 0
        for: 1m
        labels:
          severity: critical
          nfr: NFR-PER-02
        annotations:
          summary: "سرویس {{ $labels.job }} در دسترس نیست"
          description: "هدف uptime ۹۹.۹۹٪ — سرویس بیش از ۱ دقیقه down بوده است."

      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(khalij_http_requests_total{status=~"5.."}[5m]))
            /
          clamp_min(sum by (service) (rate(khalij_http_requests_total[5m])), 0.001)
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "نرخ خطای بالای ۵٪ در {{ $labels.service }}"

      - alert: HighPredictionLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(khalij_http_request_duration_seconds_bucket{service="prediction"}[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
          nfr: NFR-PER-01
        annotations:
          summary: "P95 تأخیر prediction بیش از ۲ ثانیه (NFR-PER-01)"

      - alert: ErrorBudgetBurn
        expr: |
          (1 - avg_over_time(up{job=~"khalij-api-gateway|khalij-prediction|khalij-data-ingestion"}[1h]))
            > (1 - 0.9999) * 14
        for: 10m
        labels:
          severity: critical
          nfr: NFR-PER-02
        annotations:
          summary: "سوخت سریع بودجه خطای SLO ۹۹.۹۹٪ در ۱ ساعت اخیر"
