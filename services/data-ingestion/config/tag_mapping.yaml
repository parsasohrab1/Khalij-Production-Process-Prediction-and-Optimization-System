# ==========================================================================
# Mapping of DCS/PLC tags to process variables for each unit (FR-DATA-01/02)
#
# This file is read only once at the startup of the data-ingestion service.
# To connect to a real DCS, it is enough to:
#   1. change endpoint_url (OPC-UA) or host/port (Modbus) to the real server address
#   2. align node_id / register values with the real DCS/PLC Tag List
# without needing to change the service code.
# ==========================================================================

units:
  1:
    name: "Olefin Unit 1"

    opcua:
      endpoint_url: "opc.tcp://opcua-test-server:4840/khalij/olefin1/"
      nodes:
        reactor_temp_c: "ns=2;s=Reactor.Temperature"
        reactor_pressure_bar: "ns=2;s=Reactor.Pressure"
        feed_flow_m3h: "ns=2;s=Feed.Flow"
        tank_level_percent: "ns=2;s=Tank.Level"
        ethylene_conc_percent: "ns=2;s=Gas.EthyleneConcentration"
        compressor_rpm: "ns=2;s=Compressor.RPM"

    modbus:
      host: "modbus-test-server"
      port: 5020
      # Holding Register address for each variable
      registers:
        reactor_temp_c: 0
        reactor_pressure_bar: 1
        feed_flow_m3h: 2
        tank_level_percent: 3
        ethylene_conc_percent: 4
        compressor_rpm: 5
      # Scale factor to convert the register integer value (16-bit) to the real floating value
      scale:
        reactor_temp_c: 0.1
        reactor_pressure_bar: 0.1
        feed_flow_m3h: 1.0
        tank_level_percent: 0.1
        ethylene_conc_percent: 0.1
        compressor_rpm: 1.0
